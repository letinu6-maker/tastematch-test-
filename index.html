<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TasteMatch Seoul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* 팔레트 = 서울관광재단(STO) CI 컬러
     메인: STO ORANGE #FFA300 · STO GRAY #54585A · STO VIOLET #A32D84
           STO BLUE #26225B · STO BLACK #000000 · STO WHITE #FFFFFF
     서브: STO GREEN #97D700 · LIGHT BLUE #05C3DE · BLUE #0072CE
           STO YELLOW #FFCD00 · STO BROWN #A76D11 · STO RED #C8102E */
  :root{
    --paper:#F4F5F6;          /* STO WHITE 계열 바탕 */
    --card:#FFFFFF;           /* STO WHITE */
    --panel:#26225B;          /* STO BLUE — 반전 패널 */
    --on-panel:#FFFFFF;
    --on-panel-dim:#A9A6C6;
    --ink:#26225B;            /* STO BLUE — 제목 */
    --ink-2:#54585A;          /* STO GRAY — 본문 */
    --ink-3:#8B9093;
    --line:#DCDEE0;
    --line-soft:#EAECED;
    --accent:#FFA300;         /* STO ORANGE — 시그니처 채움색 */
    --on-accent:#26225B;      /* 오렌지 위 글자 = STO BLUE */
    --red:#A76D11;            /* STO BROWN — 읽히는 오렌지(텍스트용) */
    --red-deep:#7E520C;
    --red-wash:#FFF1D6;
    --gold:#A76D11;           /* STO BROWN */
    --gold-bright:#FFCD00;    /* STO YELLOW — 어두운 패널 위 */
    --gold-wash:#FFF6D6;
    --teal:#0072CE;           /* STO BLUE(서브) */
    --teal-wash:#DCEBFA;
    --sky:#05C3DE;            /* STO LIGHT BLUE — 한강 */
    --violet:#A32D84;         /* STO VIOLET */
    --green:#5F8A00;          /* STO GREEN 심화(텍스트용) */
    --green-bright:#97D700;   /* STO GREEN */
    --alert:#C8102E;          /* STO RED */
    --wash-adv:#FFF1D6;
    --wash-trend:#F7E5F1;
    --wash-proven:#DCEBFA;
    --shadow:0 1px 2px rgba(38,34,91,.07), 0 10px 28px -16px rgba(38,34,91,.32);
    --shadow-lift:0 2px 4px rgba(38,34,91,.08), 0 18px 40px -20px rgba(38,34,91,.45);
    --display:'Gowun Batang', 'Noto Serif KR', Georgia, serif;
    --ui:'Noto Sans KR', system-ui, -apple-system, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131530;
      --card:#1D1F42;
      --panel:#26225B;
      --on-panel:#FFFFFF;
      --on-panel-dim:#9F9CC0;
      --ink:#ECEDF5;
      --ink-2:#B7BAC9;
      --ink-3:#888CA6;
      --line:#33355E;
      --line-soft:#24264B;
      --accent:#FFB025;
      --on-accent:#1A1836;
      --red:#E8A33C;
      --red-deep:#C9871F;
      --red-wash:#3A2C12;
      --gold:#E8A33C;
      --gold-bright:#FFD633;
      --gold-wash:#3A3212;
      --teal:#4D9EE8;
      --teal-wash:#16294A;
      --sky:#3FD4EA;
      --violet:#D46BB4;
      --green:#9ECF2B;
      --green-bright:#B2E33F;
      --alert:#F2627A;
      --wash-adv:#3A2C12;
      --wash-trend:#33193C;
      --wash-proven:#16294A;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.8);
      --shadow-lift:0 2px 4px rgba(0,0,0,.55), 0 18px 40px -20px rgba(0,0,0,.85);
    }
  }
  :root[data-theme="dark"]{
    --paper:#131530;
    --card:#1D1F42;
    --panel:#26225B;
    --on-panel:#FFFFFF;
    --on-panel-dim:#9F9CC0;
    --ink:#ECEDF5;
    --ink-2:#B7BAC9;
    --ink-3:#888CA6;
    --line:#33355E;
    --line-soft:#24264B;
    --accent:#FFB025;
    --on-accent:#1A1836;
    --red:#E8A33C;
    --red-deep:#C9871F;
    --red-wash:#3A2C12;
    --gold:#E8A33C;
    --gold-bright:#FFD633;
    --gold-wash:#3A3212;
    --teal:#4D9EE8;
    --teal-wash:#16294A;
    --sky:#3FD4EA;
    --violet:#D46BB4;
    --green:#9ECF2B;
    --green-bright:#B2E33F;
    --alert:#F2627A;
    --wash-adv:#3A2C12;
    --wash-trend:#33193C;
    --wash-proven:#16294A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.8);
    --shadow-lift:0 2px 4px rgba(0,0,0,.55), 0 18px 40px -20px rgba(0,0,0,.85);
  }

  *{ box-sizing:border-box; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--ui); -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; color:inherit; cursor:pointer; }
  input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--red); outline-offset:2px; border-radius:6px; }

  .wrap{ display:flex; justify-content:center; min-height:100dvh; background:var(--paper); }
  .app{
    width:100%; max-width:430px; min-height:100dvh; background:var(--paper);
    display:flex; flex-direction:column; position:relative;
  }
  @media (min-width:520px){
    .wrap{ padding-block:28px; }
    .app{ min-height:min(920px, calc(100dvh - 56px)); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:var(--shadow-lift); }
  }

  .screen{ display:flex; flex-direction:column; flex:1; min-height:0; }
  .scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .pad{ padding:22px 20px 26px; }

  /* ---------- type ---------- */
  .display{ font-family:var(--display); font-weight:700; line-height:1.32; letter-spacing:-.01em; text-wrap:balance; margin:0; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--red); }
  .lede{ font-size:14px; line-height:1.72; color:var(--ink-2); margin:0; }
  .num{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; }
  .muted{ color:var(--ink-3); font-size:12px; line-height:1.6; }

  /* ---------- intro ---------- */
  .intro{ background:var(--panel); color:var(--on-panel); }
  .intro .scroll{ display:flex; flex-direction:column; }
  .intro-body{ padding:34px 22px 22px; display:flex; flex-direction:column; gap:22px; flex:1; }
  .logo-row{ display:flex; align-items:center; gap:9px; }
  .logo-row b{ font-size:14px; font-weight:700; letter-spacing:.04em; }
  .logo-row span{ font-size:11px; color:var(--on-panel-dim); letter-spacing:.06em; }
  .intro h1{ font-size:31px; color:var(--on-panel); }
  .intro .lede{ color:var(--on-panel-dim); font-size:14px; }
  .char-strip{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .char-cell{ background:rgba(243,231,214,.06); border:1px solid rgba(243,231,214,.1); border-radius:14px; padding:8px 4px 7px; text-align:center; }
  .char-cell span{ display:block; font-size:9.5px; color:var(--on-panel-dim); margin-top:2px; letter-spacing:-.02em; }
  .facts{ display:flex; gap:8px; }
  .fact{ flex:1; border-top:1px solid rgba(243,231,214,.22); padding-top:9px; }
  .fact b{ display:block; font-family:var(--mono); font-size:17px; font-weight:600; color:var(--gold-bright); }
  .fact span{ font-size:10.5px; color:var(--on-panel-dim); line-height:1.4; display:block; margin-top:2px; }
  .intro-foot{ padding:0 22px 26px; display:flex; flex-direction:column; gap:12px; }

  /* ---------- buttons ---------- */
  .cta{ width:100%; border:none; background:var(--accent); color:var(--on-accent); border-radius:14px; padding:16px; font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .cta:disabled{ background:var(--line); color:var(--ink-3); cursor:not-allowed; }
  .cta.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .intro .cta.ghost{ border-color:rgba(243,231,214,.3); color:var(--on-panel); }
  .btn-sm{ border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px 13px; font-size:12.5px; font-weight:600; }

  /* ---------- onboarding ---------- */
  .rail{ display:flex; gap:4px; padding:20px 20px 0; }
  .rail i{ flex:1; height:3px; border-radius:2px; background:var(--line); }
  .rail i.on{ background:var(--accent); }
  .q-head{ padding:20px 20px 4px; }
  .q-head .step{ font-family:var(--mono); font-size:11px; color:var(--ink-3); letter-spacing:.06em; }
  .q-head h2{ font-family:var(--display); font-weight:700; font-size:23px; line-height:1.4; margin:8px 0 0; text-wrap:balance; }
  .q-head p{ font-size:12.5px; color:var(--ink-3); margin:8px 0 0; line-height:1.6; }
  .q-body{ padding:20px; display:flex; flex-direction:column; gap:12px; }
  .nav-bar{ padding:12px 20px 20px; display:flex; gap:10px; border-top:1px solid var(--line-soft); background:var(--paper); }
  .nav-bar .back{ flex:0 0 auto; border:1px solid var(--line); background:transparent; border-radius:14px; padding:16px 18px; font-size:14px; font-weight:600; }

  .search-row{ display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:11px 13px; }
  .search-row input{ flex:1; border:none; outline:none; background:transparent; font-size:14px; color:var(--ink); min-width:0; }
  .search-row input::placeholder{ color:var(--ink-3); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .chip.dash{ border-style:dashed; border-color:var(--red); color:var(--red); background:transparent; }
  .chip.neutral{ border-color:var(--green); color:var(--green); }
  .chip.neutral.on{ background:var(--green-bright); border-color:var(--green-bright); color:var(--on-accent); }
  .chip .rank{ font-family:var(--mono); font-size:10px; opacity:.55; }
  .chip.on .rank{ opacity:.75; }
  .empty-note{ font-size:12.5px; color:var(--ink-3); padding:2px 2px 0; }

  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice{ text-align:left; border:1px solid var(--line); background:var(--card); border-radius:15px; padding:15px 16px; display:flex; align-items:center; gap:13px; }
  .choice .dot{ width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); flex:0 0 auto; position:relative; }
  .choice.on{ border-color:var(--accent); background:var(--red-wash); }
  .choice.on .dot{ border-color:var(--accent); }
  .choice.on .dot::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
  .choice b{ display:block; font-size:14.5px; font-weight:700; }
  .choice small{ display:block; font-size:12px; color:var(--ink-3); margin-top:3px; line-height:1.5; }

  .spice-head{ display:flex; align-items:baseline; justify-content:space-between; }
  .spice-val{ font-family:var(--mono); font-size:13px; font-weight:600; color:var(--red); background:var(--red-wash); border-radius:999px; padding:4px 11px; }
  .pepper-row{ display:flex; gap:3px; }
  .pepper{ flex:1; border:none; background:none; padding:6px 0; font-size:min(6.2vw,23px); line-height:1; filter:grayscale(1); opacity:.3; transition:transform .12s ease, opacity .12s ease; }
  .pepper.on{ filter:none; opacity:1; }
  .pepper.peak{ transform:translateY(-3px) scale(1.14); }
  .scale-ends{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); margin-top:2px; }
  .spice-note{ font-size:12.5px; color:var(--ink-2); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; line-height:1.6; }

  .custom-row{ display:flex; gap:8px; }
  .custom-row input{ flex:1; border:1px solid var(--line); background:var(--card); border-radius:11px; padding:11px 12px; font-size:13.5px; outline:none; color:var(--ink); min-width:0; }
  .custom-row button{ border:none; background:var(--accent); color:var(--on-accent); border-radius:11px; padding:0 17px; font-size:13px; font-weight:700; }

  .switch-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--line); background:var(--card); border-radius:15px; padding:15px 16px; }
  .switch-row b{ font-size:14.5px; }
  .switch-row small{ display:block; font-size:12px; color:var(--ink-3); margin-top:4px; line-height:1.5; }
  .switch{ width:50px; height:29px; border-radius:999px; background:var(--line); border:none; position:relative; flex:0 0 auto; padding:0; transition:background .16s ease; }
  .switch.on{ background:var(--accent); }
  .switch i{ position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#FFFDF8; transition:transform .16s ease; }
  .switch.on i{ transform:translateX(21px); }

  /* ---------- analyzing ---------- */
  .analyze{ justify-content:center; align-items:center; gap:26px; padding:40px 26px; background:var(--panel); color:var(--on-panel); text-align:center; }
  .analyze h2{ font-family:var(--display); font-size:20px; font-weight:700; margin:0; }
  .pot{ animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
  .steps{ display:flex; flex-direction:column; gap:11px; width:100%; max-width:300px; }
  .astep{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--on-panel-dim); opacity:.3; transition:opacity .4s ease; text-align:left; }
  .astep.on{ opacity:1; color:var(--on-panel); }
  .astep .tick{ width:17px; height:17px; border-radius:50%; border:1.5px solid var(--on-panel-dim); flex:0 0 auto; display:grid; place-items:center; font-size:9px; }
  .astep.on .tick{ background:var(--gold-bright); border-color:var(--gold-bright); color:var(--panel); }
  @media (prefers-reduced-motion: reduce){ .pot{ animation:none } .astep{ transition:none } }

  /* ---------- result ---------- */
  .reveal{ background:var(--panel); color:var(--on-panel); padding:26px 22px 30px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; }
  .reveal .kicker{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-bright); font-weight:700; }
  .reveal h1{ font-family:var(--display); font-weight:700; font-size:29px; margin:6px 0 0; color:var(--on-panel); }
  .reveal .tag{ font-size:13.5px; color:var(--on-panel-dim); margin:8px 0 0; line-height:1.6; }
  .axis-pair{ display:flex; gap:7px; margin-top:14px; }
  .axis-pill{ font-size:11px; font-weight:700; border-radius:999px; padding:5px 11px; background:rgba(243,231,214,.1); border:1px solid rgba(243,231,214,.2); }
  .char-frame{ animation:pop .5s cubic-bezier(.22,1.2,.36,1) both; }
  @keyframes pop{ from{ transform:scale(.86); opacity:0 } to{ transform:scale(1); opacity:1 } }
  @media (prefers-reduced-motion: reduce){ .char-frame{ animation:none } }

  .sect{ padding:22px 20px; border-bottom:1px solid var(--line-soft); }
  .sect:last-child{ border-bottom:none; }
  .sect-title{ font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--ink-3); text-transform:uppercase; margin:0 0 13px; }
  .body-copy{ font-size:14px; line-height:1.78; color:var(--ink-2); margin:0; }

  .stat-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat{ border:1px solid var(--line); background:var(--card); border-radius:13px; padding:11px 10px; }
  .stat .k{ font-size:10px; font-weight:700; color:var(--ink-3); letter-spacing:.03em; }
  .stat .v{ font-size:13px; font-weight:700; margin-top:5px; line-height:1.3; }
  .stat .v.num{ font-size:15px; }

  .cohort{ display:flex; align-items:center; gap:12px; background:var(--gold-wash); border-radius:14px; padding:14px 15px; }
  .cohort .big{ font-family:var(--mono); font-size:24px; font-weight:600; color:var(--gold); }
  .cohort p{ margin:0; font-size:12.5px; line-height:1.6; color:var(--ink-2); }

  /* ---------- place list ---------- */
  .place{ width:100%; text-align:left; display:flex; gap:13px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; }
  .place + .place{ margin-top:10px; }
  .place .body{ flex:1; min-width:0; }
  .place .nm{ font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .place .loc{ font-size:11.5px; color:var(--ink-3); margin-top:3px; }
  .place .why{ font-size:12px; color:var(--ink-2); margin-top:8px; line-height:1.55; display:flex; gap:5px; align-items:flex-start; }
  .place .why .b{ color:var(--red); flex:0 0 auto; }
  .tagrow{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .tag{ font-size:10.5px; font-weight:600; border-radius:6px; padding:3px 7px; background:var(--line-soft); color:var(--ink-2); }
  .tag.hot{ background:var(--gold-wash); color:var(--gold); }
  .tag.veg{ background:#EAF7C9; color:var(--green); }
  .tag.halal{ background:#D6F5FA; color:#046C7C; }
  .match{ flex:0 0 auto; text-align:right; }
  .match .pct{ font-family:var(--mono); font-size:20px; font-weight:600; color:var(--red); letter-spacing:-.02em; }
  .match .lab{ font-size:9.5px; color:var(--ink-3); letter-spacing:.06em; margin-top:1px; }

  /* ---------- 위치 · 지도 ---------- */
  .locbar{ border-bottom:1px solid var(--line-soft); background:var(--card); }
  .locbtn{ width:100%; display:flex; align-items:center; gap:11px; border:none; background:none; padding:13px 18px; text-align:left; }
  .locbtn .pinico{ font-size:16px; flex:0 0 auto; }
  .locbtn .l{ flex:1; min-width:0; }
  .locbtn .k{ display:block; font-size:10.5px; color:var(--ink-3); letter-spacing:.03em; }
  .locbtn .v{ display:block; font-size:14.5px; font-weight:700; margin-top:2px; }
  .locbtn .chev{ font-size:12px; font-weight:700; color:var(--red); flex:0 0 auto; }
  .locpanel{ padding:4px 18px 17px; border-top:1px dashed var(--line); }
  .locpanel .cta.ghost{ padding:13px; font-size:14px; margin-top:13px; }

  .mapwrap{ position:relative; border-bottom:1px solid var(--line-soft); background:var(--line-soft); line-height:0; }
  .mapwrap.mini{ border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .mapsvg{ display:block; width:100%; }

  .radrow{ display:flex; align-items:center; gap:6px; padding:12px 18px; border-bottom:1px solid var(--line-soft); }
  .rchip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--ink-2); }
  .rchip.on{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .radrow .cnt{ margin-left:auto; font-size:12.5px; color:var(--red); }

  .rankdot{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:11px; font-weight:600; display:grid; place-items:center; margin-top:1px; }
  .place.sel{ border-color:var(--ink); box-shadow:0 0 0 2px var(--ink) inset; }
  .place .walk{ display:flex; align-items:baseline; gap:6px; margin-top:6px; }
  .place .walk b{ font-size:13px; color:var(--ink); }
  .place .walk span{ font-size:11.5px; color:var(--ink-3); }
  .offnote{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; border:none; background:none; padding:2px 0 10px; font-size:12px; color:var(--ink-3); text-align:left; line-height:1.5; }
  .offnote .chev{ font-weight:700; color:var(--red); flex:0 0 auto; }
  .offlist{ border-top:1px solid var(--line-soft); margin-bottom:10px; }
  .offrow{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:12px; color:var(--ink-3); }
  .offrow .r{ flex:0 0 auto; text-align:right; }
  .empty-state{ font-size:13px; line-height:1.7; color:var(--ink-2); background:var(--gold-wash); border-radius:13px; padding:14px 15px; margin-bottom:10px; }

  .filter-summary{ display:flex; flex-wrap:wrap; gap:6px; }
  .fchip{ font-size:11px; font-weight:600; border:1px solid var(--line); border-radius:999px; padding:5px 10px; color:var(--ink-2); background:var(--card); }

  function hash(str){

  function scoreMenu(menu, p){

      spice: spiceScore(menu, p.spice),
      dist: distScore(km),
      explore: exploreScore(menu, p.explore),
      vibe: vibeScore(menu, p.atmosphere),

    for(i=0;i<WEIGHTS.length;i++) total += parts[WEIGHTS[i].key] * WEIGHTS[i].w;
    return { menu:menu, parts:parts, km:km, total:Math.round(total) };
  }

    var p = state.profile;
    switch(state.step){
      case 0: return !!p.natKey;

      case 2: return !!p.atmosphere;
      case 3: return p.spice !== null;
      case 4: return p.noAllergy || p.allergens.length > 0 || p.customAllergens.length > 0;

      default: return true;

  function natChipsHTML(){
    var p = state.profile, q = state.natQuery.trim(), html = '';
    var list = NATIONS.filter(function(n){ return !q || n.label.indexOf(q) >= 0; });
    if(!list.length && !q) return '';
    list.forEach(function(n, i){
      var rank = NATIONS.indexOf(n) + 1;
      html += '<button class="chip ' + (p.natKey === n.key ? 'on' : '') + '" data-action="nat" data-key="' + n.key + '">' +
              '<span class="rank">' + rank + '</span>' + esc(n.label) + '</button>';
    });
    if(!list.length) html += '<p class="empty-note">검색 결과가 없어요. 아래 <b>직접 입력</b>으로 추가해 주세요.</p>';
    if(p.natKey === 'custom' && p.natCustom){
      html += '<button class="chip on" data-action="nat-clear">' + esc(p.natCustom) + ' <span aria-hidden="true">✕</span></button>';
    }
    html += '<button class="chip dash" data-action="nat-custom-toggle">+ 직접 입력</button>';
    return html;

             '<p class="muted">방한 관광객 수가 많은 국가 순으로 정렬했습니다. 목록에 없으면 직접 입력해 주세요.</p>';
    } else if(s === 1 || s === 2){
      var opts = s === 1 ? EXPLORE : ATMOS;
      var cur = s === 1 ? p.explore : p.atmosphere;
      var act = s === 1 ? 'explore' : 'atmos';
      body = '<div class="choices">' + opts.map(function(o){
        return '<button class="choice ' + (cur === o.key ? 'on' : '') + '" data-action="' + act + '" data-key="' + o.key + '">' +
               '<span class="dot"></span><span><b>' + esc(o.label) + '</b><small>' + esc(o.sub) + '</small></span></button>';
      }).join('') + '</div>';
    } else if(s === 3){
      var pep = '';
      for(var i=1;i<=10;i++){
        var on = p.spice !== null && i <= p.spice;
        var peak = p.spice === i;
        pep += '<button class="pepper ' + (on ? 'on' : '') + ' ' + (peak ? 'peak' : '') + '" data-action="spice" data-key="' + i + '" aria-label="매운맛 ' + i + '점">🌶️</button>';
      }
      body = '<div class="spice-head"><span class="muted">1 = 순한맛 · 10 = 불닭</span>' +
             '<span class="spice-val">' + (p.spice === null ? '—' : p.spice + '/10') + '</span></div>' +
             '<div class="pepper-row">' + pep + '</div>' +
             '<div class="scale-ends"><span>김치도 매워요</span><span>불닭 완주 가능</span></div>' +
             (p.spice !== null ? '<div class="spice-note">' + esc(spiceNote(p.spice)) + '</div>' : '');
    } else if(s === 4){
      body = '<div class="search-row">' + ICON.search +
             '<input type="text" id="algSearch" placeholder="재료 검색 (예: 갑각류, 글루텐)" value="' + esc(state.algQuery) + '" autocomplete="off"></div>' +
             '<div class="chips" id="algChips">' + algChipsHTML() + '</div>' +
             (state.showAlgCustom ? '<div class="custom-row"><input type="text" id="algCustom" placeholder="예: 참외, 키위" autocomplete="off"><button data-action="alg-custom-add">추가</button></div>' : '') +
             '<p class="muted">여러 개를 고를 수 있어요. 고른 재료가 들어간 메뉴는 추천 목록에서 아예 빠집니다.</p>';
    } else if(s === 5){
      body = '<div class="chips">' + VEGAN_TYPES.map(function(v){
        var on = !p.veganNone && p.vegan.indexOf(v.key) >= 0;
        return '<button class="chip ' + (on ? 'on' : '') + '" data-action="vegan" data-key="' + v.key + '">' + esc(v.label) + '</button>';
      }).join('') +
      '<button class="chip neutral ' + (p.veganNone ? 'on' : '') + '" data-action="vegan-none">해당없음</button></div>' +
      '<p class="muted">고른 유형을 모두 만족하는 메뉴만 남깁니다.</p>';
    } else {
      body = '<div class="switch-row"><span><b>할랄 음식만 보여주기</b>' +
             '<small>할랄 인증 또는 성분이 확인된 메뉴만 추천합니다.</small></span>' +
             '<button class="switch ' + (p.halal ? 'on' : '') + '" data-action="halal" role="switch" aria-checked="' + (p.halal ? 'true' : 'false') + '" aria-label="할랄 전용"><i></i></button></div>' +
             '<p class="muted">지금은 ' + (p.halal ? '할랄 인증 메뉴만' : '모든 메뉴를') + ' 대상으로 추천합니다.</p>';
    }

    var rail = '';
    for(var k=0;k<7;k++) rail += '<i class="' + (k <= state.step ? 'on' : '') + '"></i>';

    var primary = state.editing ? '저장하고 돌아가기' : (state.step === 6 ? '추천 시작하기' : '다음');

    return '<div class="screen">' +
      '<div class="rail">' + rail + '</div>' +
      '<div class="scroll">' +
        '<div class="q-head"><div class="step">STEP ' + (state.step + 1) + ' / 7</div>' +
        '<h2>' + esc(def.title) + '</h2><p>' + esc(def.note) + '</p></div>' +
        '<div class="q-body">' + body + '</div>' +
      '</div>' +
      '<div class="nav-bar">' +
        (state.step > 0 && !state.editing ? '<button class="back" data-action="prev">이전</button>' : '') +
        (state.editing ? '<button class="back" data-action="cancel-edit">취소</button>' : '') +
        '<button class="cta" data-action="next"' + (stepValid() ? '' : ' disabled') + '>' + primary + '</button>' +
      '</div></div>';
  }

  var ANALYZE_STEPS = [
    '비짓서울 API 음식 콘텐츠 불러오는 중',
    '국적별 선호 통계 대조하는 중',

    'SNS 실시간 화제성 반영하는 중'
  ];

    var done = state.analyzeStep || 0;
    var steps = ANALYZE_STEPS.map(function(t, i){
      return '<div class="astep ' + (i < done ? 'on' : '') + '"><span class="tick">' + (i < done ? '✓' : '') + '</span>' + esc(t) + '</div>';
    }).join('');
    return '<div class="screen analyze">' +
      '<div class="pot">' + character(state.profile.explore, state.profile.atmosphere, 96) + '</div>' +
      '<h2>' + esc(natLabel(state.profile)) + ' 여행자 데이터와<br>맞춰보고 있어요</h2>' +
      '<div class="steps">' + steps + '</div></div>';

  function tabs(active){
    var items = [
      { key:'result', label:'내 유형', icon:ICON.user },
      { key:'places', label:'주변 맛집', icon:ICON.pin },

             it.icon + '<span>' + it.label + '</span></button>';

  }

        '<div class="walk"><b class="num">' + fmtDist(e.km) + '</b><span>걸어서 ' + walkMin(e.km) + '분</span></div>' +
        '<div class="why"><span class="b">→</span><span>' + esc(topReasons(e, p, 1)[0]) + '</span></div></div>' +
        '<div class="match"><div class="pct">' + e.total + '</div><div class="lab">MATCH</div></div></button>';

    return '<div class="screen">' +
      (state.previewCombo ? '<div class="banner"><span>' + esc(per.title) + ' 유형으로 미리보는 중</span><button data-action="clear-preview">내 유형으로</button></div>' : '') +
      '<div class="scroll">' +
        '<div class="reveal">' +
          '<div class="char-frame">' + character(parts[0], parts[1], 132) + '</div>' +
          '<div class="kicker">' + (state.previewCombo ? '다른 유형 미리보기' : '당신의 미식가 유형') + '</div>' +
          '<h1>' + esc(per.title) + '</h1>' +
          '<p class="tag">' + esc(per.tag) + '</p>' +
          '<div class="axis-pair"><span class="axis-pill">' + esc(exShort) + '</span><span class="axis-pill">' + esc(atShort) + '</span></div>' +
        '</div>' +
        '<div class="sect"><p class="body-copy">' + esc(per.body) + '</p>' +
          '<div class="kw-row" style="margin-top:14px">' + per.kw.map(function(k){ return '<span class="kw">' + esc(k) + '</span>'; }).join('') + '</div>' +
        '</div>' +
        '<div class="sect"><h3 class="sect-title">입력한 조건</h3>' +
          '<div class="stat-3">' +
            '<div class="stat"><div class="k">국적</div><div class="v">' + esc(natLabel(p)) + '</div></div>' +
            '<div class="stat"><div class="k">매운맛</div><div class="v num">' + p.spice + '/10</div></div>' +
            '<div class="stat"><div class="k">분위기</div><div class="v">' + esc(atShort) + '</div></div>' +
          '</div>' +
          '<div class="cohort" style="margin-top:12px"><span class="big">' + pct + '%</span>' +
          '<p>같은 조건을 입력한 <b>' + esc(natLabel(p)) + '</b> 여행자 중 이 유형의 비율이에요.</p></div>' +
        '</div>' +
        '<div class="sect"><h3 class="sect-title">' + esc(state.origin.label) + ' 주변 상위 추천</h3>' + preview +
          '<button class="cta" style="margin-top:12px" data-action="go" data-key="places">지도에서 주변 ' + rec.list.length + '곳 보기</button>' +
          '<button class="cta ghost" style="margin-top:8px" data-action="go" data-key="guide">9가지 유형 둘러보기</button>' +
        '</div>' +
      '</div>' + tabs('result') + '</div>';

  var RADII = [0.5, 1, 2, 5];

  function placeCard(e, p, rank){
    var m = e.menu;
    var tags = '<span class="tag">🌶️ ' + m.spice + '/10</span><span class="tag">' + esc(VIBE_LABEL[m.vibe]) + '</span>';
    if(m.buzz >= 70) tags += '<span class="tag hot">화제</span>';
    if(m.veganOk.length) tags += '<span class="tag veg">채식 가능</span>';
    if(m.halal) tags += '<span class="tag halal">할랄</span>';
    var why = topReasons(e, p, 2);
    return '<button class="place ' + (state.selectedId === m.id ? 'sel' : '') + '" id="card-' + m.id + '" data-action="menu" data-key="' + m.id + '">' +
      (rank ? '<span class="rankdot">' + rank + '</span>' : '') +
      '<div class="body"><div class="nm">' + esc(m.name) + '</div>' +
      '<div class="loc">' + esc(m.place) + ' · ' + esc(m.gu) + '</div>' +
      '<div class="walk"><b class="num">' + fmtDist(e.km) + '</b><span>걸어서 ' + walkMin(e.km) + '분</span></div>' +
      why.map(function(w){ return '<div class="why"><span class="b">→</span><span>' + esc(w) + '</span></div>'; }).join('') +
      '<div class="tagrow">' + tags + '</div></div>' +
      '<div class="match"><div class="pct">' + e.total + '</div><div class="lab">MATCH</div></div></button>';
  }

  function locPanel(){
    if(!state.showLoc) return '';
    var chips = ORIGINS.map(function(o){
      return '<button class="chip ' + (state.origin.key === o.key ? 'on' : '') + '" data-action="origin" data-key="' + o.key + '">' + esc(o.label) + '</button>';
    }).join('');
    return '<div class="locpanel">' +
      '<button class="cta ghost" data-action="geo">📍 지금 내 위치로 설정하기</button>' +
      (state.geoMsg ? '<p class="muted" style="margin:9px 0 0">' + esc(state.geoMsg) + '</p>' : '') +
      '<p class="muted" style="margin:12px 0 8px">또는 이동 거점에서 고르기</p>' +
      '<div class="chips">' + chips + '</div></div>';
  }

  function screenPlaces(){
    var p = activePersonaProfile();
    var rec = recommend(p);
    var per = PERSONAS[activeCombo()];

    var radChips = RADII.map(function(r){
      return '<button class="rchip ' + (state.radiusKm === r ? 'on' : '') + '" data-action="radius" data-key="' + r + '">' +
             fmtRadius(r) + '</button>';
    }).join('');

    var body;
    if(rec.list.length){
      body = rec.list.map(function(e, i){ return placeCard(e, p, i + 1); }).join('');
    } else {
      var nearest = rec.far[0];
      body = '<div class="empty-state"><b>반경 ' + fmtRadius(state.radiusKm) + ' 안에는 조건에 맞는 곳이 없어요.</b>' +
        (nearest ? '<br>가장 가까운 곳은 ' + esc(nearest.menu.name) + ' — ' + fmtDist(nearest.km) + ' 거리예요. 반경을 넓혀보세요.' : '') + '</div>' +
        (nearest ? placeCard(nearest, p, null) : '');

      notes = '<button class="offnote" data-action="toggle-off">' +

        '<span class="chev">' + (state.showOff ? '접기' : '보기') + '</span></button>';

        notes += '<div class="offlist">' +

          }).join('') + '</div>';
      }

      (state.previewCombo ? '<div class="banner"><span>' + esc(per.title) + ' 유형 기준 추천</span><button data-action="clear-preview">내 유형으로</button></div>' : '') +
      '<div class="scroll">' +
        '<div class="locbar"><button class="locbtn" data-action="toggle-loc">' +
          '<span class="pinico">📍</span><span class="l"><span class="k">현재 위치' + (state.origin.live ? ' · GPS' : '') + '</span>' +
          '<span class="v">' + esc(state.origin.label) + '</span></span>' +

        '<div class="mapwrap">' + mapSVG(rec.list, state.radiusKm, state.selectedId) + '</div>' +
        '<div class="radrow"><span class="muted">반경</span>' + radChips +
          '<span class="cnt num">' + rec.list.length + '곳</span></div>' +
        '<div class="pad" style="padding-top:14px">' +
          '<h2 class="display" style="font-size:20px;margin:0 0 4px">' + esc(per.title) + '에게 가까운 순서</h2>' +
          '<p class="muted" style="margin:0 0 13px">매치도 = 국적 선호 26% · 매운맛 20% · <b>거리 18%</b> · 탐색 성향 16% · 분위기 12% · 화제성 8%</p>' +
          notes +
          '<div style="margin-top:12px">' + body + '</div>' +
          '<p class="fine" style="margin-top:16px">지도는 비짓서울 API 관광콘텐츠의 위경도 좌표를 평면 투영해 그렸습니다. 거리·도보 시간은 직선거리 기준 추정값입니다.</p>' +
        '</div>' +
      '</div>' + tabs('places') + '</div>';
  }

      '<div class="sect"><h3 class="sect-title">여기서 가는 길</h3>' +
        '<div class="mapwrap mini">' + mapSVG([e], Math.max(0.4, e.km * 1.25), m.id, { h:180, hideLabel:true }) + '</div>' +
        '<div class="kv" style="margin-top:4px"><span class="k">' + esc(state.origin.label) + '에서</span>' +
        '<span class="v num">' + fmtDist(e.km) + ' · 도보 ' + walkMin(e.km) + '분</span></div></div>' +
      '<div class="sect"><h3 class="sect-title">이 점수가 나온 이유</h3><div class="bars">' + bars + '</div></div>' +
      '<div class="sect"><h3 class="sect-title">내 조건과 대조</h3>' +
        '<div class="kv"><span class="k">거리</span><span class="v num">' + fmtDist(e.km) + ' (반경 ' + fmtRadius(state.radiusKm) + ' 기준)</span></div>' +
        '<div class="kv"><span class="k">' + esc(natLabel(p)) + ' 여행자 선호도</span><span class="v num">' + e.parts.nat + ' / 100</span></div>' +

        '<div class="kv"><span class="k">할랄</span><span class="v ' + (m.halal ? 'ok' : 'no') + '">' + (m.halal ? '인증 확인' : '미인증') + '</span></div>' +

      '<div class="sect"><h3 class="sect-title">비짓서울 API 실시간 확인</h3>' + liveSectionHtml(m) + '</div>' +
      '<div class="sect"><h3 class="sect-title">다음 한 입</h3>' + others + '</div>' +
      '</div>' + tabs('places') + '</div>';
  }

  /* 이 화면에서만 쓰는 비짓서울 실시간 연동 — 서버(/api/contents)를 통해
     같은 카테고리의 실제 비짓서울 콘텐츠를 즉석에서 조회해 보여줍니다.
     (매칭 엔진 자체는 위 MENUS 샘플 데이터를 기준으로 동작하고,
      이 섹션만 실제 API 키로 라이브 호출을 검증하는 용도입니다) */
  function liveSectionHtml(m){
    var cache = state.liveCache[m.id];
    if(!cache){
      return '<button class="cta ghost" data-action="live-check" data-key="' + m.id + '">🔎 \'' + esc(m.cat.split('·')[0].trim()) + '\' 실시간 검색해보기</button>' +
        '<p class="fine" style="margin-top:8px">비짓서울 API에 지금 이 카테고리로 실시간 검색을 요청해, 실제 등록된 콘텐츠를 가져옵니다.</p>';
    }
    if(cache.loading){
      return '<p class="muted">비짓서울 API를 호출하는 중…</p>';
    }
    if(!cache.ok){
      return '<p class="muted">⚠️ ' + esc(cache.message || '호출에 실패했어요') + '</p>' +
        '<p class="fine" style="margin-top:6px">API 키 승인 전이거나 아직 등록되지 않았다면 정상적인 현상입니다.</p>';
    }
    var items = (cache.data && cache.data.data) || [];
    if(!Array.isArray(items) || !items.length){
      return '<p class="muted">이 카테고리로 검색된 실제 콘텐츠를 찾지 못했어요.</p>';
    }
    return '<div>' + items.slice(0, 5).map(function(it){
      return '<div class="kv"><span class="k">' + esc(it.post_sj || it.cid || '이름 없음') + '</span><span class="v">' + esc(it.cid || '') + '</span></div>';
    }).join('') + '</div>' +
      '<p class="fine" style="margin-top:8px">비짓서울 API에서 실시간으로 받아온 결과입니다.</p>';
  }

  function screenGuide(){
    var mine = comboKey(state.profile);
    var groups = EXPLORE.map(function(ex){
      var rows = ATMOS.map(function(at){
        var key = ex.key + '-' + at.key;
        var per = PERSONAS[key];
        var isMine = key === mine;
        return '<button class="type-row ' + (isMine ? 'mine' : '') + '" data-action="type" data-key="' + key + '">' +
          '<span class="avatar" style="background:' + AXIS_WASH[ex.key] + '">' + character(ex.key, at.key, 44) + '</span>' +
          '<span class="info"><span class="nm">' + esc(per.title) + (isMine ? '<span class="mine-badge">내 유형</span>' : '') + '</span>' +
          '<span class="sub">' + esc(per.tag) + '</span></span></button>';
      }).join('');
      return '<div class="type-group"><div class="group-head">' +
        '<span class="swatch" style="background:' + AXIS_COLOR[ex.key] + '"></span>' +
        '<b>' + esc(ex.short) + '</b><small>' + esc(ex.sub) + '</small></div>' + rows + '</div>';
    }).join('');

    return '<div class="screen"><div class="scroll"><div class="pad">' +
      '<h2 class="display" style="font-size:22px;margin:0 0 4px">9가지 미식가 유형</h2>' +
      '<p class="muted" style="margin:0 0 18px">새로운 메뉴를 고르는 방식(가로 축)과 선호하는 식당 분위기(세로 축)를 조합해 아홉 가지가 나옵니다. 눌러서 다른 유형의 추천도 볼 수 있어요.</p>' +
      groups + '</div></div>' + tabs('guide') + '</div>';
  }

  function screenType(){
    var key = state.openType;
    var per = PERSONAS[key];
    var parts = key.split('-');
    var isMine = key === comboKey(state.profile);
    var exShort = EXPLORE.filter(function(e){ return e.key === parts[0]; })[0];
    var atShort = ATMOS.filter(function(a){ return a.key === parts[1]; })[0];

    return '<div class="screen"><div class="scroll">' +
      '<div class="topbar"><button data-action="go" data-key="guide" aria-label="뒤로">' + ICON.back + '</button><h3>미식가 유형</h3></div>' +
      '<div class="reveal">' +
        '<div class="char-frame">' + character(parts[0], parts[1], 124) + '</div>' +
        '<div class="kicker">' + (isMine ? '내 유형' : '유형 소개') + '</div>' +
        '<h1>' + esc(per.title) + '</h1><p class="tag">' + esc(per.tag) + '</p>' +
        '<div class="axis-pair"><span class="axis-pill">' + esc(exShort.short) + '</span><span class="axis-pill">' + esc(atShort.short) + '</span></div>' +
      '</div>' +
      '<div class="sect"><p class="body-copy">' + esc(per.body) + '</p>' +
        '<div class="kw-row" style="margin-top:14px">' + per.kw.map(function(k){ return '<span class="kw">' + esc(k) + '</span>'; }).join('') + '</div></div>' +
      '<div class="sect"><h3 class="sect-title">이 유형의 기준</h3>' +
        '<div class="kv"><span class="k">메뉴 선택</span><span class="v">' + esc(exShort.label) + '</span></div>' +
        '<div class="kv"><span class="k">식당 분위기</span><span class="v">' + esc(atShort.label) + '</span></div></div>' +
      '<div class="sect">' +
        (isMine
          ? '<button class="cta" data-action="go" data-key="places">내 추천 맛집 보기</button>'
          : '<button class="cta" data-action="preview" data-key="' + key + '">이 유형 기준으로 추천 보기</button>' +
            '<p class="fine" style="margin-top:9px">내 조건(국적·매운맛·알레르기)은 그대로 두고, 이 유형의 성향만 적용해 다시 계산합니다.</p>') +
      '</div></div>' + tabs('guide') + '</div>';
  }

  function screenProfile(){
    var p = state.profile;
    var rows = [
      { k:'국적', v:natLabel(p), step:0 },
      { k:'메뉴 선택 성향', v:EXPLORE.filter(function(e){ return e.key === p.explore; })[0].label, step:1 },
      { k:'식당 분위기', v:ATMOS.filter(function(a){ return a.key === p.atmosphere; })[0].label, step:2 },
      { k:'매운맛', v:p.spice + ' / 10', step:3 },
      { k:'알레르기 · 못 먹는 재료', v:p.noAllergy ? '없음' :
          p.allergens.map(function(a){ return ALLERGEN_LABEL[a]; }).concat(p.customAllergens).join(', '), step:4 },
      { k:'채식', v:p.veganNone ? '해당없음' : p.vegan.map(function(v){ return VEGAN_LABEL[v]; }).join(', '), step:5 },
      { k:'할랄', v:p.halal ? '할랄 인증 메뉴만' : '제한 없음', step:6 }
    ];
    return '<div class="screen"><div class="scroll"><div class="pad">' +
      '<h2 class="display" style="font-size:22px;margin:0 0 4px">내 조건</h2>' +
      '<p class="muted" style="margin:0 0 8px">값을 바꾸면 유형과 추천이 즉시 다시 계산됩니다.</p>' +
      rows.map(function(r){
        return '<div class="prow"><span class="l"><span class="k">' + esc(r.k) + '</span>' +
          '<span class="v">' + esc(r.v || '—') + '</span></span>' +
          '<button class="btn-sm" data-action="edit" data-key="' + r.step + '">수정</button></div>';
      }).join('') +
      '<button class="cta ghost" style="margin-top:20px" data-action="reset">처음부터 다시 하기</button>' +
      '<p class="fine" style="margin-top:14px">2026 서울관광재단 비짓서울 API 데이터·AI 활용 아이디어 공모전 · 미식 프로파일러 프로토타입. 메뉴 데이터는 비짓서울 API 음식 콘텐츠 구조를 본뜬 샘플입니다.</p>' +
      '</div></div>' + tabs('profile') + '</div>';
  }

  /* ============================================================
     렌더 & 이벤트
     ============================================================ */

  var root = document.getElementById('app');

  function render(){
    var html;
    switch(state.screen){
      case 'intro': html = screenIntro(); break;
      case 'onboarding': html = screenOnboarding(); break;
      case 'analyzing': html = screenAnalyzing(); break;
      case 'result': html = screenResult(); break;
      case 'places': html = screenPlaces(); break;
      case 'menu': html = screenMenu(); break;
      case 'guide': html = screenGuide(); break;
      case 'type': html = screenType(); break;
      case 'profile': html = screenProfile(); break;
      default: html = screenIntro();
    }
    root.innerHTML = html;
    var sc = root.querySelector('.scroll');
    if(sc && state.keepScroll !== true) sc.scrollTop = 0;
    state.keepScroll = false;
    var focusId = state.focusAfter;
    state.focusAfter = null;
    if(focusId){
      var el = document.getElementById(focusId);
      if(el) el.focus();
    }
    if(state.scrollToSel && state.selectedId){
      var card = document.getElementById('card-' + state.selectedId);
      if(card) card.scrollIntoView({ block:'center', behavior:'smooth' });
    }
    state.scrollToSel = false;
  }

  function toggleIn(arr, key){
    var i = arr.indexOf(key);
    if(i >= 0) arr.splice(i, 1); else arr.push(key);
  }

  function requestGeo(){
    if(!navigator.geolocation){
      state.geoMsg = '이 브라우저에서는 위치를 가져올 수 없어요. 아래에서 거점을 골라주세요.';
      state.keepScroll = true; render(); return;
    }
    state.geoMsg = '위치를 확인하는 중…';
    state.keepScroll = true; render();
    navigator.geolocation.getCurrentPosition(function(pos){
      var la = pos.coords.latitude, ln = pos.coords.longitude;
      var inSeoul = la > 37.41 && la < 37.71 && ln > 126.76 && ln < 127.19;
      state.origin = { key:'live', label:inSeoul ? '현재 위치' : '현재 위치 (서울 밖)', lat:la, lng:ln, live:true };
      state.geoMsg = inSeoul ? '' : '서울 밖이라 반경 안에 결과가 없을 수 있어요. 거점을 골라 데모로 볼 수 있습니다.';
      state.showLoc = !inSeoul;
      state.selectedId = null;
      state.keepScroll = true; render();
    }, function(){
      state.geoMsg = '위치 권한이 없어요. 아래에서 거점을 골라주세요.';
      state.keepScroll = true; render();
    }, { timeout:8000, maximumAge:60000 });
  }

  function startAnalyze(){
    state.screen = 'analyzing';
    state.analyzeStep = 0;
    render();
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var gap = reduced ? 180 : 480;
    var i = 1;
    var timer = setInterval(function(){
      state.analyzeStep = i;
      if(state.screen !== 'analyzing'){ clearInterval(timer); return; }
      render();
      i++;
      if(i > ANALYZE_STEPS.length){
        clearInterval(timer);
        setTimeout(function(){
          if(state.screen !== 'analyzing') return;
          saveProfile();
          state.screen = 'result';
          render();
        }, reduced ? 150 : 420);
      }
    }, gap);
  }

  root.addEventListener('click', function(ev){
    var btn = ev.target.closest('[data-action]');
    if(!btn) return;
    var a = btn.getAttribute('data-action');
    var key = btn.getAttribute('data-key');
    var p = state.profile;

    switch(a){
      case 'start':
        state.profile = { natKey:null, natCustom:'', explore:null, atmosphere:null, spice:null,
          allergens:[], customAllergens:[], noAllergy:false, vegan:[], veganNone:false, halal:false };
        state.step = 0; state.natQuery = ''; state.algQuery = '';
        state.showNatCustom = false; state.showAlgCustom = false;
        state.screen = 'onboarding'; render(); break;

      case 'resume':
        var saved = loadSaved();
        if(saved){ state.profile = saved; state.screen = 'result'; }
        else state.screen = 'onboarding';
        render(); break;

      case 'nat':
        p.natKey = key; p.natCustom = ''; state.showNatCustom = false;
        state.keepScroll = true; render(); break;
      case 'nat-clear':
        p.natKey = null; p.natCustom = ''; state.keepScroll = true; render(); break;
      case 'nat-custom-toggle':
        state.showNatCustom = !state.showNatCustom;
        state.focusAfter = state.showNatCustom ? 'natCustom' : null;
        state.keepScroll = true; render(); break;
      case 'nat-custom-add':
        var nv = (document.getElementById('natCustom') || {}).value || '';
        nv = nv.trim();
        if(nv){ p.natKey = 'custom'; p.natCustom = nv; state.showNatCustom = false; state.natQuery = ''; }
        state.keepScroll = true; render(); break;

      case 'explore': p.explore = key; state.keepScroll = true; render(); break;
      case 'atmos': p.atmosphere = key; state.keepScroll = true; render(); break;
      case 'spice': p.spice = parseInt(key, 10); state.keepScroll = true; render(); break;

      case 'alg':
        p.noAllergy = false; toggleIn(p.allergens, key); state.keepScroll = true; render(); break;
      case 'alg-none':
        p.noAllergy = !p.noAllergy;
        if(p.noAllergy){ p.allergens = []; p.customAllergens = []; }
        state.keepScroll = true; render(); break;
      case 'alg-custom-toggle':
        state.showAlgCustom = !state.showAlgCustom;
        state.focusAfter = state.showAlgCustom ? 'algCustom' : null;
        state.keepScroll = true; render(); break;
      case 'alg-custom-add':
        var av = (document.getElementById('algCustom') || {}).value || '';
        av = av.trim();
        if(av && p.customAllergens.indexOf(av) < 0){ p.customAllergens.push(av); p.noAllergy = false; }
        state.showAlgCustom = false; state.algQuery = '';
        state.keepScroll = true; render(); break;
      case 'alg-remove':
        p.customAllergens.splice(parseInt(btn.getAttribute('data-idx'), 10), 1);
        state.keepScroll = true; render(); break;

      case 'vegan':
        p.veganNone = false; toggleIn(p.vegan, key); state.keepScroll = true; render(); break;
      case 'vegan-none':
        p.veganNone = !p.veganNone;
        if(p.veganNone) p.vegan = [];
        state.keepScroll = true; render(); break;

      case 'halal': p.halal = !p.halal; state.keepScroll = true; render(); break;

      case 'prev':
        if(state.step > 0) state.step--;
        render(); break;
      case 'next':
        if(!stepValid()) return;
        if(state.editing){ state.editing = false; saveProfile(); state.screen = 'profile'; render(); return; }
        if(state.step < 6){ state.step++; render(); }
        else startAnalyze();
        break;
      case 'cancel-edit':
        state.editing = false; state.screen = 'profile'; render(); break;
      case 'edit':
        state.editing = true; state.step = parseInt(key, 10);
        state.screen = 'onboarding'; render(); break;
      case 'reset':
        try{ localStorage.removeItem(STORE_KEY); }catch(e){}
        state.previewCombo = null; state.screen = 'intro'; render(); break;

      case 'go':
        if(key === 'result' || key === 'places' || key === 'guide' || key === 'profile'){
          state.screen = key; render();
        }
        break;
      case 'toggle-off':
        state.showOff = !state.showOff; state.keepScroll = true; render(); break;
      case 'toggle-loc':
        state.showLoc = !state.showLoc; state.keepScroll = true; render(); break;
      case 'origin':
        var o = ORIGINS.filter(function(x){ return x.key === key; })[0];
        state.origin = { key:o.key, label:o.label, lat:o.lat, lng:o.lng, live:false };
        state.showLoc = false; state.geoMsg = ''; state.selectedId = null;
        state.keepScroll = true; render(); break;
      case 'geo':
        requestGeo(); break;
      case 'radius':
        state.radiusKm = parseFloat(key); state.selectedId = null;
        state.keepScroll = true; render(); break;
      case 'pin':
        state.selectedId = state.selectedId === key ? null : key;
        state.scrollToSel = !!state.selectedId;
        state.keepScroll = true; render(); break;

      case 'menu':
        state.activeMenu = key; state.screen = 'menu'; render(); break;
      case 'type':
        state.openType = key; state.screen = 'type'; render(); break;
      case 'preview':
        state.previewCombo = key; state.screen = 'places'; render(); break;
      case 'clear-preview':
        state.previewCombo = null; render(); break;

      case 'live-check':
        var mm = MENUS.filter(function(x){ return x.id === key; })[0];
        if(!mm) break;
        state.liveCache[key] = { loading:true };
        state.keepScroll = true; render();
        fetch('/api/contents?' + new URLSearchParams({
          keyword: mm.cat.split('·')[0].trim(),
          lang_code_id: 'ko'
        }))
          .then(function(r){ return r.json(); })
          .then(function(data){
            state.liveCache[key] = data;
            if(state.screen === 'menu' && state.activeMenu === key){ state.keepScroll = true; render(); }
          })
          .catch(function(err){
            state.liveCache[key] = { ok:false, message:String(err && err.message || err) };
            if(state.screen === 'menu' && state.activeMenu === key){ state.keepScroll = true; render(); }
          });
        break;
    }
  });

  root.addEventListener('input', function(ev){
    var t = ev.target;
    if(t.id === 'natSearch'){
      state.natQuery = t.value;
      var box = document.getElementById('natChips');
      if(box) box.innerHTML = natChipsHTML();
    } else if(t.id === 'algSearch'){
      state.algQuery = t.value;
      var box2 = document.getElementById('algChips');
      if(box2) box2.innerHTML = algChipsHTML();
    }
  });

  root.addEventListener('keydown', function(ev){
    if(ev.key !== 'Enter') return;
    if(ev.target.id === 'natCustom'){
      ev.preventDefault();
      var b = root.querySelector('[data-action="nat-custom-add"]');
      if(b) b.click();
    } else if(ev.target.id === 'algCustom'){
      ev.preventDefault();
      var b2 = root.querySelector('[data-action="alg-custom-add"]');
      if(b2) b2.click();
    }
  });

  render();
})();
</script>

</body></html>
